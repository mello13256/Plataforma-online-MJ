name: Publicar no Firebase

# Publica o site sempre que há alterações no ramo principal do repositório
# (ou manualmente, em Actions → Publicar no Firebase → Run workflow).
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # para o GitHub se identificar no Google Cloud sem chaves

env:
  PROJETO: plataforma-web-mj

concurrency:
  group: publicar-firebase
  cancel-in-progress: false

jobs:
  publicar:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm test

      - name: Preparar o site
        run: npm run preparar

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/732929806250/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-publicar@plataforma-web-mj.iam.gserviceaccount.com

      - name: Publicar
        run: |
          npx firebase deploy --only hosting,firestore:rules --project "$PROJETO" --non-interactive
          echo "### Site publicado em https://$PROJETO.web.app 🎮" >> "$GITHUB_STEP_SUMMARY"
